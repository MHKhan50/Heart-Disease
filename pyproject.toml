[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heartv2"
version = "0.1.0"
description = "Heart disease prediction V2: leakage audit and cross-hospital validation on the UCI heart disease databases"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muzammal Hussain" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.2", "scipy", "matplotlib"]

[project.optional-dependencies]
models = ["xgboost", "lightgbm", "catboost", "tabpfn", "shap"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
